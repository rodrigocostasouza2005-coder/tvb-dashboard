name: Dry-run migracao classificacao produto+cor

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Digite 'apply' pra consolidar de verdade (default: dry-run, so leitura)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Rodar migracao (dry-run por padrao)
        run: |
          if [ "${{ github.event.inputs.apply }}" = "apply" ]; then
            npx tsx scripts/backfill-classificacao-produto-cor.ts --apply
          else
            npx tsx scripts/backfill-classificacao-produto-cor.ts
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
