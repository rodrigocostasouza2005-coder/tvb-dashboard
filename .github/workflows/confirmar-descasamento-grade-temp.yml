name: Confirmação temporária somente-leitura — descasamento de grade (achado §16.3)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  confirmar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Rodar confirmação (somente leitura)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/confirmar-descasamento-grade-temp.ts
