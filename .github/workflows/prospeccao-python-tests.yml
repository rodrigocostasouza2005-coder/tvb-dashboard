name: Prospecting importer tests

on:
  pull_request:
    paths:
      - "scripts/prospeccao/**"
      - ".github/workflows/prospeccao-python-tests.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "scripts/prospeccao/**"
      - ".github/workflows/prospeccao-python-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate prospecting Python syntax
        run: python -m py_compile scripts/prospeccao/extrair-parquet-receita.py scripts/prospeccao/baixar_receita_cnpj.py
      - name: Run importer regression tests
        run: python -m unittest discover -s scripts/prospeccao/tests -v
