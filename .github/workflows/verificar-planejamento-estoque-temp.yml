name: Verificação temporária somente-leitura do Planejamento de Estoque (Fase 1)

# Temporário — chama a função real getProdutosPlanejamento/getProdutoPlanejamentoDetalhe contra
# produção pra confirmar que não quebra e que os números fazem sentido antes da revisão do PR.
# Execução exclusivamente manual (workflow_dispatch), somente leitura, DATABASE_URL de produção
# via secret do GitHub.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Rodar verificação (somente leitura)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/verificar-planejamento-estoque-temp.ts
