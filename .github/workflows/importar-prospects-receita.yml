name: Importar prospects reais da Receita Federal

on:
  workflow_dispatch:
    inputs:
      competencia:
        description: "Competência do dump (AAAA-MM)"
        required: true
        default: "2026-10"
        type: string
      uf:
        description: "UF da primeira carga"
        required: true
        default: "RJ"
        type: choice
        options:
          - RJ
          - SP
          - MG
          - ES

permissions:
  contents: read

concurrency:
  group: importar-prospects-receita-${{ inputs.uf }}
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar credencial de produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o secret DATABASE_URL do Neon de produção em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Preparar Python e Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.4.1
          npm ci

      - name: Extrair estabelecimentos ativos de moda do Parquet remoto
        run: |
          python scripts/prospeccao/extrair-parquet-receita.py \
            --competencia "${{ inputs.competencia }}" \
            --uf "${{ inputs.uf }}" \
            --saida dados/prospects-receita.csv

      - name: Validar e importar no Neon de produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run prospeccao:importar-receita -- \
            --arquivo dados/prospects-receita.csv \
            --competencia "${{ inputs.competencia }}" \
            --municipios dados/municipios-receita.csv \
            --uf "${{ inputs.uf }}" \
            --apply
