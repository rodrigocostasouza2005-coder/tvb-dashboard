name: Diagnóstico temporário somente-leitura — Etapa 7 (re-coleta órfãos cd-atacado)

# Temporário — autorização formal explícita de Rodrigo (Etapa 7, 2026-11-13). Execução
# exclusivamente manual (workflow_dispatch). DATABASE_URL de produção só como secret, nunca
# impresso em log. Script sem nenhum update/create/delete.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Rodar diagnóstico (somente leitura)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/diagnostico-orfaos-etapa7-temp.ts
