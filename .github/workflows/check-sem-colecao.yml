name: Investigar produtos sem colecao (so leitura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Checar (so SELECT, nunca escreve)
        run: npx tsx scripts/_tmp-check-sem-colecao.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
