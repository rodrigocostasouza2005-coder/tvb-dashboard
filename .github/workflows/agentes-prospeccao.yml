name: Exportação controlada de candidatos de prospecção TVB

# Segurança: este workflow não importa nem qualifica registros no Neon.
# Sem schedule/push: só executa quando acionado manualmente.
on:
  workflow_dispatch:
    inputs:
      uf:
        description: "UF para exportação pontual"
        required: true
        default: "RJ"
        type: choice
        options:
          - RJ
          - SP
          - ES
          - PR
          - SC
          - RS
          - BA
          - SE
          - AL
          - PE
          - PB
          - RN
          - CE
          - PI
          - MA
          - PA
          - AP
          - MG
      competencia:
        description: "Competência Receita Federal (AAAA-MM)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  exportar-sem-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Definir competência e UF
        id: params
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.competencia }}" ]; then
            echo "competencia=${{ github.event.inputs.competencia }}" >> "$GITHUB_OUTPUT"
          else
            echo "competencia=$(date -u -d 'last month' +%Y-%m)" >> "$GITHUB_OUTPUT"
          fi
          echo "uf=${{ github.event.inputs.uf }}" >> "$GITHUB_OUTPUT"
      - name: Instalar DuckDB
        run: python -m pip install duckdb==1.4.1
      - name: Exportar candidatos para artefato temporário
        run: |
          python scripts/prospeccao/extrair-parquet-receita.py \
            --competencia "${{ steps.params.outputs.competencia }}" \
            --uf "${{ steps.params.outputs.uf }}" \
            --saida dados/prospects-receita.csv
      - name: Disponibilizar CSV temporário (sem gravar no Neon)
        uses: actions/upload-artifact@v4
        with:
          name: candidatos-receita-${{ steps.params.outputs.uf }}-${{ steps.params.outputs.competencia }}
          path: |
            dados/prospects-receita.csv
            dados/municipios-receita.csv
          retention-days: 3
          if-no-files-found: error
