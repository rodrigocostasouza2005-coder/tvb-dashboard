name: Exportação controlada de candidatos de prospecção TVB

# Segurança: este workflow não importa nem qualifica registros no Neon.
# Sem schedule/push: só executa quando acionado manualmente.
on:
  workflow_dispatch:
    inputs:
      uf:
        description: "UF para exportação pontual"
        required: true
        default: "RJ"
        type: choice
        options:
          - RJ
          - SP
          - ES
          - PR
          - SC
          - RS
          - BA
          - SE
          - AL
          - PE
          - PB
          - RN
          - CE
          - PI
          - MA
          - PA
          - AP
          - MG
      competencia:
        description: "Competência Receita Federal (AAAA-MM)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  exportar-sem-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.PROSPECCAO_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PROSPECCAO_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.PROSPECCAO_S3_REGION }}
      PROSPECCAO_S3_ENDPOINT: ${{ secrets.PROSPECCAO_S3_ENDPOINT }}
      PROSPECCAO_S3_BUCKET: ${{ secrets.PROSPECCAO_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Definir competência e UF
        id: params
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.competencia }}" ]; then
            echo "competencia=${{ github.event.inputs.competencia }}" >> "$GITHUB_OUTPUT"
          else
            echo "competencia=$(date -u -d 'last month' +%Y-%m)" >> "$GITHUB_OUTPUT"
          fi
          echo "uf=${{ github.event.inputs.uf }}" >> "$GITHUB_OUTPUT"
      - name: Validar destino externo (S3 compatível)
        shell: bash
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Secret PROSPECCAO_S3_ACCESS_KEY_ID ausente"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Secret PROSPECCAO_S3_SECRET_ACCESS_KEY ausente"; exit 1; }
          test -n "$PROSPECCAO_S3_ENDPOINT" || { echo "Secret PROSPECCAO_S3_ENDPOINT ausente"; exit 1; }
          test -n "$PROSPECCAO_S3_BUCKET" || { echo "Secret PROSPECCAO_S3_BUCKET ausente"; exit 1; }
          test -n "$AWS_DEFAULT_REGION" || { echo "Secret PROSPECCAO_S3_REGION ausente (use auto no Cloudflare R2)"; exit 1; }
      - name: Instalar DuckDB
        run: python -m pip install duckdb==1.4.1
      - name: Exportar conjunto completo para Parquet compactado
        run: |
          python scripts/prospeccao/extrair-parquet-receita.py \
            --competencia "${{ steps.params.outputs.competencia }}" \
            --uf "${{ steps.params.outputs.uf }}" \
            --saida dados/candidatos.parquet
      - name: Persistir fora do Neon em bucket S3 compatível
        shell: bash
        run: |
          aws s3 cp dados/candidatos.parquet \
            "s3://$PROSPECCAO_S3_BUCKET/receita-cnpj/competencia=${{ steps.params.outputs.competencia }}/uf=${{ steps.params.outputs.uf }}/candidatos.parquet" \
            --endpoint-url "$PROSPECCAO_S3_ENDPOINT" \
            --only-show-errors
          echo "Arquivo persistido no bucket externo; nenhuma linha foi enviada ao Neon."
