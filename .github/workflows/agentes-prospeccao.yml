name: Exportação controlada de candidatos de prospecção TVB

# Execução manual e somente exportação: não grava leads no Neon nem contata lojas.
on:
  workflow_dispatch:
    inputs:
      competencia:
        description: "Competência Receita Federal (AAAA-MM)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  exportar-sem-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INPUT_COMPETENCIA: ${{ inputs.competencia }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar competência
        id: params
        shell: bash
        run: |
          if [ -n "$INPUT_COMPETENCIA" ]; then COMPETENCIA="$INPUT_COMPETENCIA"; else COMPETENCIA="$(date -u -d 'last month' +%Y-%m)"; fi
          [[ "$COMPETENCIA" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]] || { echo "Competência inválida"; exit 1; }
          echo "competencia=$COMPETENCIA" >> "$GITHUB_OUTPUT"
      - name: Instalar DuckDB
        run: python -m pip install duckdb==1.4.1
      - name: Exportar lojas de vestuário dos 17 estados litorâneos
        env:
          COMPETENCIA: ${{ steps.params.outputs.competencia }}
        run: |
          # UFs lidas do mesmo JSON que o script Python e o lado TS (src/lib/prospeccao/
          # estados-litoraneos.ts) usam como fonte única — nunca mais uma lista hardcoded aqui
          # (ver auditoria pós-PR#51-53, achado B.3/E.7/D6: a lista vivia duplicada em 3 lugares).
          UFS=$(python -c "import json; print(' '.join(json.load(open('scripts/prospeccao/estados-litoraneos.json'))))")
          python scripts/prospeccao/extrair-parquet-receita.py \
            --competencia "$COMPETENCIA" \
            --ufs $UFS \
            --saida dados/candidatos-litoral.parquet
      - name: Disponibilizar base e manifesto para revisão
        uses: actions/upload-artifact@v4
        with:
          name: tvb-prospeccao-litoral-${{ steps.params.outputs.competencia }}-${{ github.run_id }}
          path: |
            dados/candidatos-litoral.parquet
            dados/candidatos-litoral.parquet.manifest.json
          if-no-files-found: error
          retention-days: 30
