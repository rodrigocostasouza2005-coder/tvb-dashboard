name: Diagnóstico temporário somente-leitura (grupo ZINZANE/RJ)

# Temporário — investiga se o grupo "23x ZINZANE · RIO DE JANEIRO/RJ" (achado do diagnóstico de
# prospecção) é rede legítima (CNPJ-raiz distintos, endereços distintos) ou duplicação real de
# cadastro. Execução exclusivamente manual, somente leitura, DATABASE_URL de produção via secret.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Rodar diagnóstico (somente leitura)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/prospeccao/_tmp-check-zinzane.ts
