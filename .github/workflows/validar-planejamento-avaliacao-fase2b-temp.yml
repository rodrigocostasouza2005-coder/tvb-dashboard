name: Validação temporária somente-leitura do Planejamento de Estoque (Fase 2B — avaliação de compras)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Rodar validação (somente leitura)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/validar-planejamento-avaliacao-fase2b-temp.ts
