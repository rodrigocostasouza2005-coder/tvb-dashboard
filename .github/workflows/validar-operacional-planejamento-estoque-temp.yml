name: Validação operacional temporária somente-leitura — Planejamento Inteligente de Estoque

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Rodar validação (somente leitura)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/validar-operacional-planejamento-estoque-temp.ts
