name: Consulta cadastral oficial CNPJ - Serpro

on:
  workflow_dispatch:
    inputs:
      uf:
        description: "UF dos prospectos pendentes"
        required: true
        default: "RJ"
        type: choice
        options: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      limite:
        description: "Máximo de consultas nesta execução (1 a 25)"
        required: true
        default: "5"
        type: string
      aplicar:
        description: "Executar consultas reais Serpro (podem gerar cobrança) e gravar os resultados"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SERPRO_CNPJ_CONSUMER_KEY: ${{ secrets.SERPRO_CNPJ_CONSUMER_KEY }}
      SERPRO_CNPJ_CONSUMER_SECRET: ${{ secrets.SERPRO_CNPJ_CONSUMER_SECRET }}
      SERPRO_CNPJ_API_BASE_URL: ${{ vars.SERPRO_CNPJ_API_BASE_URL }}
      SERPRO_CNPJ_TOKEN_URL: ${{ vars.SERPRO_CNPJ_TOKEN_URL }}
      UF: ${{ inputs.uf }}
      LIMITE: ${{ inputs.limite }}
      APLICAR: ${{ inputs.aplicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar parâmetros
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Secret DATABASE_URL ausente"; exit 1; }
          [[ "$LIMITE" =~ ^[0-9]+$ ]] && (( LIMITE >= 1 && LIMITE <= 25 )) || { echo "Limite deve ser de 1 a 25"; exit 1; }
          if [ "$APLICAR" = "true" ]; then
            test -n "$SERPRO_CNPJ_CONSUMER_KEY" || { echo "Secret SERPRO_CNPJ_CONSUMER_KEY ausente"; exit 1; }
            test -n "$SERPRO_CNPJ_CONSUMER_SECRET" || { echo "Secret SERPRO_CNPJ_CONSUMER_SECRET ausente"; exit 1; }
          fi
      - name: Prévia ou consulta oficial
        run: |
          ARGS=(--uf "$UF" --limit "$LIMITE")
          if [ "$APLICAR" = "true" ]; then ARGS+=(--apply); fi
          npm run prospeccao:consultar-cnpj -- "${ARGS[@]}"
