name: Sync rápido de cancelamentos

# Deveria disparar /api/sync-cancelamentos a cada ~5min, mas o schedule do GitHub Actions NÃO
# entrega essa cadência neste repo — medido em 2026-10-13 via `gh run list`: os disparos
# event=schedule realmente acontecem (não está "morto"), só que espaçados de ~3 a ~9 HORAS, não
# minutos, mesmo com cron "*/5". Confirmado com um 2º workflow independente (scheduler-diagnostic,
# removido depois de servir de evidência) rodando o mesmo cron e mostrando o MESMO padrão de gaps
# — ou seja, é throttling da plataforma GitHub Actions pra schedules de alta frequência em repos
# de baixa atividade, não um defeito deste YAML. Na prática esse workflow hoje não entrega cadência
# melhor que os 5 crons diários do sync completo (vercel.json) — é só um fallback ocasional.
#
# Correção real: este MESMO repositório já resolve exatamente esse problema pra /api/sync-frequent
# (sync completo a cada 10min) usando cron-job.org, um agendador externo gratuito — ver
# src/app/api/sync-frequent/route.ts. /api/sync-cancelamentos usa o MESMO EXTERNAL_SYNC_SECRET e
# o mesmo contrato (POST/GET + header x-sync-secret), então o passo que falta é só o Rodrigo
# cadastrar um 2º monitor em cron-job.org apontando pra
# https://tvb-dashboard.vercel.app/api/sync-cancelamentos a cada ~5min (mesma credencial que ele já
# tem salva lá pro sync-frequent) — nenhuma mudança de código é necessária pro endpoint em si.
# Mantemos este workflow como fallback best-effort (gratuito, sem risco) até isso ser configurado.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  VERCEL_APP_URL: https://tvb-dashboard.vercel.app

jobs:
  sync-cancelamentos:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar /api/sync-cancelamentos
        env:
          EXTERNAL_SYNC_SECRET: ${{ secrets.EXTERNAL_SYNC_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${EXTERNAL_SYNC_SECRET:-}" ]; then
            echo "EXTERNAL_SYNC_SECRET não está configurado nos Secrets do repositório."
            exit 1
          fi

          start_ts=$(date +%s)
          http_status=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 55 \
            -X POST \
            -H "x-sync-secret: ${EXTERNAL_SYNC_SECRET}" \
            "${VERCEL_APP_URL}/api/sync-cancelamentos")
          end_ts=$(date +%s)
          duration=$((end_ts - start_ts))

          echo "HTTP status: ${http_status}"
          echo "Duração: ${duration}s"

          # Log sanitizado — só os campos de resultado, nunca o segredo nem o corpo cru.
          if command -v jq >/dev/null 2>&1 && jq -e . response.json >/dev/null 2>&1; then
            jq '{ok, skipped, reason, saleUpdates, returnUpdates, falhas: (.falhas | length)}' response.json
          else
            echo "(resposta não-JSON ou vazia, omitida do log)"
          fi

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "Endpoint retornou erro HTTP ${http_status} — falhando o job."
            exit 1
          fi
